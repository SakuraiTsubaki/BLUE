name: Expansion contract

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tools/verify_expansion_contract.py
      - run: python tools/verify_mbc5_runtime.py
      - run: python -m unittest discover -s tests -v
