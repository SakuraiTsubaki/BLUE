name: Engine expansion

on:
  push:
    branches: [main]
    paths:
      - "patches/pokeemerald-expansion/**"
      - "config/runtime_id_budget.json"
      - "config/expansion_limits.json"
      - "manifests/engine-base.json"
      - "tools/verify_engine_expansion.py"
      - ".github/workflows/engine-expansion.yml"
  pull_request:
    paths:
      - "patches/pokeemerald-expansion/**"
      - "config/runtime_id_budget.json"
      - "config/expansion_limits.json"
      - "manifests/engine-base.json"
      - "tools/verify_engine_expansion.py"

env:
  UPSTREAM_REF: 75b806a3ab57a81ff1eb6179288981f0b3cc3050
  GAME_REVISION: 0
  GAME_LANGUAGE: ENGLISH
  COMPARE: 0
  UNUSED_ERROR: 1
  DEPRECATED_ERROR: 1

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tools/verify_engine_expansion.py

  arm-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout BLUE
        uses: actions/checkout@v4

      - name: Checkout pinned pokeemerald-expansion
        uses: actions/checkout@v4
        with:
          repository: rh-hideout/pokeemerald-expansion
          ref: ${{ env.UPSTREAM_REF }}
          path: upstream

      - name: Apply BLUE runtime overlay
        run: git -C upstream apply ../patches/pokeemerald-expansion/0001-widen-boxpokemon-content-ids.patch

      - name: Install ARM toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            binutils-arm-none-eabi gcc-arm-none-eabi libnewlib-arm-none-eabi \
            libpng-dev python3

      - name: Build patched Emerald engine
        working-directory: upstream
        env:
          GAME_VERSION: EMERALD
        run: make -j2 -O all
